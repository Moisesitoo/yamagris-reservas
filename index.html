<script type="module">
import {firebaseConfig} from "./config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
if(!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith("PEGA")){
  document.getElementById("app").innerHTML='<div class="card"><b>Falta configurar Firebase.</b><br>Abre el archivo <code>config.js</code> y pega los datos de tu proyecto (mira el README).</div>';
}else{
  const app=initializeApp(firebaseConfig);
  const fdb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  const auth=getAuth(app);
  window.__db={
    collection:p=>({onSnapshot:(f,e)=>onSnapshot(collection(fdb,p),s=>f({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),metadata:s.metadata}),e)}),
    doc:path=>({set:d=>setDoc(doc(fdb,path),d),delete:()=>deleteDoc(doc(fdb,path)),onSnapshot:(f,e)=>onSnapshot(doc(fdb,path),s=>f({exists:s.exists(),data:()=>s.data()}),e)})
  };
  window.__login=(em,pw)=>signInWithEmailAndPassword(auth,em,pw);
  window.__logout=()=>signOut(auth).then(()=>location.reload());
  let started=false;
  onAuthStateChanged(auth,u=>{
    if(u){if(!started){started=true;document.getElementById("lo").style.display="block";boot();}}
    else{started=false;showLogin();}
  });
}
</script>
